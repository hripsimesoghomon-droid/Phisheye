<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PhishEye</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="PhishEye">
    <div class="brand" id="brand-slot"></div>
    <nav class="side-nav" aria-label="Main" id="side-nav"></nav>
    <div class="side-theme" id="side-theme"></div>
  </aside>
  <main id="view" tabindex="-1"></main>
  <nav class="bottom" aria-label="Main" id="bottom-nav"></nav>
</div>
<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" class="sr-only" accept="image/*,.pdf,.eml,.txt" tabindex="-1" aria-hidden="true">

<script>
try { var th = localStorage.getItem("phisheye-theme"); if (th === "dark" || th === "light") document.documentElement.setAttribute("data-theme", th); } catch(e){}
(function(){
  /* ---------- icons ---------- */
  function svg(p, size, sw){ return '<svg width="'+(size||24)+'" height="'+(size||24)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'; }
  var P = {
    shieldEye:'<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/><path d="M7.5 12s1.8-3 4.5-3 4.5 3 4.5 3-1.8 3-4.5 3-4.5-3-4.5-3z"/><circle cx="12" cy="12" r="1.1"/>',
    shield:'<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/>',
    shieldBang:'<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/><path d="M12 8v5"/><path d="M12 16v.01"/>',
    check:'<path d="M6 12.5l4 4L18 8"/>',
    pause:'<path d="M9 6v12M15 6v12"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
    tri:'<path d="M12 4l9 16H3L12 4z"/><path d="M12 10v4"/><path d="M12 17.5v.01"/>',
    oct:'<path d="M8.5 3h7L21 8.5v7L15.5 21h-7L3 15.5v-7L8.5 3z"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/>',
    okCircle:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>',
    msg:'<path d="M4 5h16v11H9l-5 4V5z"/>',
    qr:'<rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/>',
    phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"/>',
    link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
    lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    home:'<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4v-9z"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    back:'<path d="M15 5l-7 7 7 7"/>',
    upload:'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>',
    file:'<path d="M14 3H6v18h12V7l-4-4z"/><path d="M14 3v4h4"/>',
    up:'<path d="M12 19V5M6 11l6-6 6 6"/>',
    moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3z"/>',
    x:'<path d="M7 7l10 10M17 7L7 17"/>',
    chat:'<path d="M3 5h13v9H8l-5 4V5z"/><circle cx="18" cy="16" r="4"/><path d="M16.5 16l1 1 2-2"/>'
  };

  /* ---------- data ---------- */
  var LEVEL = { safe:'Safe', suspicious:'Suspicious', high:'High Risk' };
  var SAMPLES = {
    high:{ chip:'Bank text', type:'Text message', level:'high', connected:true,
      input:'NORTHBANK: Unusual sign-in detected. Your account will be locked in 2 hours. Verify now: northbank-secure.co/login',
      title:'This is a fake bank message',
      reasons:['The link is not Northbank\u2019s real website.','The fake website was made 3 days ago.','It tries to rush you: \u201clocked in 2 hours.\u201d'],
      advice:['Don\u2019t tap the link. Don\u2019t reply.','Worried? Call Northbank using the number on the back of your card.'],
      details:[['Website age','3 days'],['Scam lists','Listed on 2 of 5'],['Pretends to be','northbank.com']] },
    suspicious:{ chip:'Parcel text', type:'Text message', level:'suspicious', connected:false,
      input:'Your parcel is on hold. Pay a $1.99 redelivery fee within 24h: parcel-track-help.net',
      title:'Be careful. This may be a delivery scam.',
      reasons:['Real delivery companies rarely ask for small fees by text.','The website is new and not from a known company.'],
      advice:['Don\u2019t pay through this link.','Check your parcel on the delivery company\u2019s official app.'],
      details:[['Website age','2 months'],['Scam lists','Not listed'],['Asks for payment','Yes, $1.99']] },
    safe:{ chip:'Link from a friend', type:'Link', level:'safe', connected:false,
      input:'https://en.wikipedia.org/wiki/Phishing',
      title:'This link looks safe',
      reasons:['Wikipedia is a well-known website.','It doesn\u2019t ask for passwords, codes or money.'],
      advice:['You can open it.','Never type a password on a page you reached from a message.'],
      details:[['Website age','20+ years'],['Scam lists','Not listed'],['Certificate','Valid']] },
    phone:{ type:'Phone number', level:'high', connected:true, input:'+1 (213) 555-0147',
      title:'This number is used by scammers',
      reasons:['Other people reported this number for pretending to be a bank.','It is linked to a fake bank text you received.'],
      advice:['Don\u2019t answer or call back.','Never give a code or password on the phone.'],
      details:[['Reports','Reported as a scam'],['Pretends to be','Northbank'],['Linked to','northbank-secure.co']] },
    qr:{ type:'QR code', level:'high', connected:false, input:'QR sticker on parking meter \u2192 pay-parking-now.co/pay',
      title:'This QR code opens a fake payment page',
      reasons:['It is not the city\u2019s parking website.','It asks for your card number straight away.'],
      advice:['Don\u2019t enter your card details.','Pay with the official parking app or at the meter.'],
      details:[['Website age','9 days'],['Scam lists','Listed on 1 of 5'],['Asks for','Card number']] }
  };
  var TYPES = [
    { id:'message', label:'Message', field:'Paste the message, link or phone number', ph:'For example: \u201cNORTHBANK: Your account will be locked in 2 hours. Verify now: northbank-secure.co/login\u201d', ex:'high' },
    { id:'link', label:'Link', field:'Paste the link here', ph:'For example: parcel-track-help.net', ex:'suspicious' },
    { id:'phone', label:'Phone', field:'Type the phone number', ph:'For example: +1 (213) 555-0147', ex:'phone' }
  ];
  var SEED = [
    { label:'Call from +1 (213) 555-0147', sub:'Phone call', when:'Yesterday, 6:40 PM', level:'suspicious', explain:'We couldn\u2019t confirm who this caller was. Real companies rarely call from an unfamiliar number to ask about your account.' },
    { label:'weather.gov', sub:'Link', when:'Monday', level:'safe', explain:'A well-known U.S. government website. It doesn\u2019t ask for passwords, codes or money.' },
    { label:'\u201cYou won a $500 gift card\u201d', sub:'Email', when:'Sep 20', level:'high', explain:'It offers a surprise prize and pushes you to act fast \u2014 a common trick scammers use to get your details.' }
  ];
  var TOGGLES = [
    { id:'bubble', label:'Show the PhishEye button in other apps', sub:'The small icon next to messages. High-risk warnings always show.' },
    { id:'warnLinks', label:'Warn before opening risky links', sub:'For suspicious (orange) links.' },
    { id:'openAnyway', label:'Allow \u201cOpen anyway\u201d on blocked websites', sub:'Off is safest.' },
    { id:'notify', label:'Text my trusted contact about high-risk scams', sub:'They get a short alert, never the message itself.' }
  ];

  /* ---------- state ---------- */
  var STORE = 'phisheye-web-v1';
  function load(){ try { var v = localStorage.getItem(STORE); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
  var saved = load() || {};
  var S = {
    route:'home', type:'message', input:'', sampleKey:null, attachment:null, dropError:'',
    result:null, scanStep:0, showDetails:false, sharedHelp:false,
    history: saved.history || SEED.slice(), hasAlert: saved.hasAlert !== undefined ? saved.hasAlert : true,
    protection: saved.protection || 'on',
    admin: saved.admin || { bubble:true, warnLinks:true, openAnyway:false, notify:true },
    retention: saved.retention || 30, onboarded: !!saved.onboarded, plan: saved.plan || 'free',
    adminUnlocked:false, pin:'', pinError:false,
    draft:'Here is the code: 482913', scamDeleted:false, sheet:null, popup:false, ob:0
  };
  function save(){ try { localStorage.setItem(STORE, JSON.stringify({ history:S.history, hasAlert:S.hasAlert, protection:S.protection, admin:S.admin, retention:S.retention, onboarded:S.onboarded, plan:S.plan })); } catch(e){} }

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function $(id){ return document.getElementById(id); }
  var timers = [], toastT = null;
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

  function toast(msg){ var t = $('toast'); t.textContent = msg; if (toastT) clearTimeout(toastT); toastT = setTimeout(function(){ t.textContent=''; }, 3000); }

  function analyze(txt, type){
    var t = txt.toLowerCase();
    var link = /(https?:\/\/|www\.)/.test(t) || /\b[a-z0-9-]+\.(com|net|org|co|info|xyz|app|io|link|top)\b/.test(t);
    var pressure = ['urgent','locked','suspend','within 24','immediately','act now','final notice','expire'].some(function(w){ return t.indexOf(w)>=0; });
    var asks = ['otp','code','password','pin','card','pay','fee','gift','verify','login','sign in'].some(function(w){ return t.indexOf(w)>=0; });
    var reasons = [];
    if (pressure) reasons.push('It tries to rush you or scare you.');
    if (asks) reasons.push('It asks for money, a password or a code.');
    if (link) reasons.push('It has a link we don\u2019t trust.');
    var score = (pressure?1:0)+(asks?1:0)+(link?1:0);
    var level = score>=2 ? 'high' : (score===1 ? 'suspicious' : 'safe');
    if (!reasons.length) reasons = ['We didn\u2019t find signs of a scam.','It doesn\u2019t ask for money, passwords or codes.'];
    var titles = { high:'This looks like a scam', suspicious:'Be careful with this', safe:'This looks safe' };
    var advice = {
      high:['Don\u2019t tap any links. Don\u2019t reply.','Call the company using a number you already know.'],
      suspicious:['Don\u2019t pay or share details yet.','Ask your trusted contact if you\u2019re not sure.'],
      safe:['It looks fine.','If something asks for a password or money later, check again.']
    };
    return { type:{message:'Text message',link:'Link',phone:'Phone number'}[type]||'Message', level:level, connected:false, input:txt,
      title:titles[level], reasons:reasons, advice:advice[level],
      details:[['Link found',link?'Yes':'No'],['Rushing words',pressure?'Yes':'No'],['Asks for money or codes',asks?'Yes':'No']] };
  }

  /* ---------- routing ---------- */
  var ROUTES = ['home','check','qr','checking','result','connected','history','admin','demo','plans'];
  function go(r){ if (location.hash === '#/'+r) { navigate(); } else { location.hash = '#/'+r; } }
  function navigate(){
    var r = (location.hash || '').replace(/^#\/?/, '') || 'home';
    if (ROUTES.indexOf(r) < 0) r = 'home';
    if (r === 'checking' && S.route !== 'checking') r = 'check';
    if (r !== 'checking') clearTimers();
    S.route = r; S.sheet = null; S.popup = false; S.showDetails = false; S.sharedHelp = false;
    render(true);
  }

  /* ---------- nav ---------- */
  function navHtml(isSide){
    var active = S.route === 'checking' || S.route === 'result' || S.route === 'qr' ? 'check' : (S.route === 'connected' ? 'home' : S.route);
    var items = isSide
      ? [['home','Home',P.home],['check','Check something',P.search],['history','History',P.clock],['demo','Messages demo',P.chat],['plans','Plans',P.star],['admin','Admin',P.lock]]
      : [['home','Home',P.home],['check','Check',P.search],['history','History',P.clock],['admin','Admin',P.lock]];
    return items.map(function(it){
      return '<button type="button" data-act="nav" data-to="'+it[0]+'"'+(active===it[0]?' aria-current="page"':'')+'>'+svg(it[2], isSide?26:28)+esc(it[1])+'</button>';
    }).join('');
  }

  /* ---------- views ---------- */
  function backBtn(label, to){ return '<div class="back"><button type="button" class="icon-btn" aria-label="'+esc(label)+'" data-act="nav" data-to="'+to+'">'+svg(P.back,28,2.2)+'</button>'; }
  function isDark(){ return document.documentElement.getAttribute('data-theme') === 'dark'; }
  function mobileBrand(){ var d = isDark(); return '<div class="mobile-top"><div class="mobile-brand">'+svg(P.shieldEye,32,1.8)+'<span>PhishEye</span></div><button type="button" class="theme-icon" data-act="theme" aria-pressed="'+d+'" aria-label="Dark mode">'+svg(d?P.sun:P.moon,26)+'</button></div>'; }
  function sideTheme(){ var d = isDark(); return '<span style="color:var(--muted);display:flex">'+svg(d?P.moon:P.sun,24)+'</span><span class="lbl" id="lbl-theme">Dark mode</span><button type="button" class="switch" data-act="theme" aria-pressed="'+d+'" aria-labelledby="lbl-theme"><span></span></button>'; }

  function vHome(){
    var on = S.protection === 'on';
    return '<div class="wrap">'+mobileBrand()+
      '<h1 class="h1" tabindex="-1" data-focus>Is something bothering you?</h1>'+
      '<button type="button" class="btn btn-primary btn-hero" data-act="startType" data-type="message">'+svg(P.search,32,2.2)+'Check something</button>'+
      '<div class="status '+(on?'on':'paused')+'"><div class="dot">'+svg(on?P.check:P.pause,26,2.6)+'</div><div><div class="st-title">'+(on?'You\u2019re protected':'Paused by admin')+'</div><div>'+(on?'PhishEye is watching your messages and links.':'Dangerous (high-risk) threats are still blocked.')+'</div></div></div>'+
      (S.hasAlert && S.plan==='premium' ? '<button type="button" class="alert" data-act="nav" data-to="connected">'+svg(P.tri,34)+'<span><strong>Warning: possible scam</strong>A call, a text and a website may be the same scam. Select to see.</span></button>' : '')+
      (S.plan==='free' ? '<button type="button" class="plan-card" style="width:100%;text-align:left;cursor:pointer;color:var(--ink)" data-act="nav" data-to="plans"><span style="color:var(--accent);display:flex">'+svg(P.star,30)+'</span><span class="grow"><span style="display:block;font-weight:700;font-size:20px">You\u2019re on the Free plan</span><span style="display:block;color:var(--muted)">Premium adds live scam checks and family alerts.</span><span style="display:block;font-weight:700;color:var(--accent);margin-top:6px;text-decoration:underline">See plans</span></span></button>'
        : '<div class="plan-card"><span style="color:var(--accent);display:flex">'+svg(P.star,30)+'</span><div class="grow"><div style="font-weight:700;font-size:20px">Premium plan</div><div style="color:var(--muted)">Full protection is on.</div></div></div>')+
      '<button type="button" class="demo-link" data-act="nav" data-to="demo">Demo: see PhishEye inside Messages</button>'+
    '</div>';
  }

  function fmtSize(n){ return n < 1024*1024 ? Math.max(1, Math.round(n/1024))+' KB' : (n/1024/1024).toFixed(1)+' MB'; }

  function vCheck(){
    var t = TYPES.filter(function(x){ return x.id===S.type; })[0] || TYPES[0];
    var att = S.attachment;
    var attHtml = att
      ? '<div class="attached">'+(att.url ? '<img class="thumb" src="'+att.url+'" alt="">' : '<div class="thumb">'+svg(P.file,30)+'</div>')+
          '<div style="flex-grow:1;min-width:0"><div class="att-name">'+esc(att.name)+'</div><div class="att-meta">'+esc(att.meta)+'</div></div>'+
          '<button type="button" class="btn-link" data-act="removeAttach">Remove</button></div>'
      : '<div id="drop" class="drop">'+
          '<div class="drop-icon">'+svg(P.upload,36)+'</div>'+
          '<p class="drop-title"><span class="drag-only">Drag a screenshot or file here</span><span class="touch-only">Add a screenshot or file</span></p>'+
          '<p class="drop-sub">Photos, PDFs, or saved emails. Up to 10 MB.</p>'+
          '<button type="button" class="btn btn-secondary" data-act="chooseFile">Choose a file</button>'+
          (S.dropError ? '<p class="drop-error" role="alert">'+esc(S.dropError)+'</p>' : '')+
        '</div>';
    return '<div class="wrap">'+backBtn('Back to home','home')+'<h1 class="h1" tabindex="-1" data-focus>Check something</h1></div>'+
      '<div class="field"><label for="pe-input">'+esc(t.field)+'</label><textarea id="pe-input" rows="5" placeholder="'+esc(t.ph)+'">'+esc(S.input)+'</textarea></div>'+
      attHtml+
      '<div class="examples"><div class="examples-label">Or try an example</div><div class="chips">'+
        ['high','suspicious','safe'].map(function(k){ return '<button type="button" class="chip" data-act="example" data-key="'+k+'" aria-pressed="'+(S.sampleKey===k)+'">'+SAMPLES[k].chip+'</button>'; }).join('')+
      '</div></div>'+
      '<button type="button" class="btn btn-primary btn-block" data-act="check">Check now</button>'+
    '</div>';
  }

  function vQr(){
    return '<div class="wrap">'+backBtn('Back to home','home')+'<h1 class="h1" tabindex="-1" data-focus>Scan a QR code</h1></div>'+
      '<div class="card" style="background:#17191E;border-color:#17191E;color:#FFFFFF;display:flex;flex-direction:column;align-items:center;gap:20px;padding:32px 20px">'+
        '<div style="width:min(280px,100%);aspect-ratio:1;border:4px solid #FFFFFF;border-radius:28px;background:#262930;display:flex;align-items:center;justify-content:center;color:#9AA0AA">'+svg(P.qr,72,1.4)+'</div>'+
        '<p style="font-size:20px;text-align:center;max-width:320px">Point your camera at the code. We check it before you open it.</p>'+
      '</div>'+
      '<button type="button" class="btn btn-primary btn-block" data-act="simulateScan">Simulate a scan</button>'+
    '</div>';
  }

  function vChecking(){
    var labels = ['Checking scam lists','Looking at the website','Reading the message'];
    return '<div class="wrap"><div class="center">'+
      '<div style="text-align:center;display:flex;flex-direction:column;gap:16px"><div class="orb">'+svg(P.shieldEye,62,1.6)+'</div><h1 class="h1" tabindex="-1" data-focus>Checking\u2026</h1><p class="lead">This takes a few seconds.</p></div>'+
      '<div class="card steps" aria-live="polite">'+labels.map(function(l,i){ var c = i<S.scanStep?'done':(i===S.scanStep?'cur':''); return '<div class="step '+c+'"><span class="sd">'+(i<S.scanStep?svg(P.check,16,3):'')+'</span>'+l+'</div>'; }).join('')+'</div>'+
    '</div></div>';
  }

  function vResult(){
    var r = S.result || SAMPLES.high;
    var icon = r.level==='high'?P.oct:(r.level==='suspicious'?P.tri:P.okCircle);
    return '<div class="wrap">'+backBtn('Back to home','home')+'<span class="h2">Result</span></div>'+
      '<div class="verdict '+r.level+'"><div class="verdict-top">'+svg(icon,46)+'<h1 class="verdict-label" tabindex="-1" data-focus>'+LEVEL[r.level]+'</h1></div><p class="verdict-title">'+esc(r.title)+'</p></div>'+
      (r.connected ? (S.plan==='premium' ? '<button type="button" class="linked" data-act="nav" data-to="connected">'+svg(P.link,30)+'<span><strong>Part of a bigger scam</strong>Linked to 2 earlier events. Select to see.</span></button>'
        : '<button type="button" class="linked" data-act="nav" data-to="plans">'+svg(P.star,30)+'<span><strong>Is this part of a bigger scam?</strong>Premium connects texts, calls and websites. See plans.</span></button>') : '')+
      '<div class="two">'+
        '<section style="display:flex;flex-direction:column;gap:12px"><h2 class="h2">Why</h2><div class="reasons '+r.level+'">'+r.reasons.map(function(x){ return '<div class="reason"><span>'+esc(x)+'</span></div>'; }).join('')+'</div></section>'+
        '<section class="card" style="display:flex;flex-direction:column;gap:14px"><h2 class="h2">What to do</h2>'+r.advice.map(function(x,i){ return '<div class="todo"><span class="num">'+(i+1)+'</span><span style="padding-top:3px">'+esc(x)+'</span></div>'; }).join('')+'</section>'+
      '</div>'+
      '<div class="actions">'+
        (r.level==='safe' ? '<button type="button" class="btn btn-primary btn-block" data-act="nav" data-to="home">Done</button>' : '<button type="button" class="btn btn-primary btn-block" data-act="report">Block and report</button>')+
        '<button type="button" class="btn btn-secondary btn-block" data-act="callFamily">Call my trusted contact</button>'+
        '<button type="button" class="btn-link" data-act="toggleDetails" aria-expanded="'+S.showDetails+'">'+(S.showDetails?'Hide details':'Show more details')+'</button>'+
        (S.showDetails ? '<div class="card" style="padding:6px 18px"><p style="font-size:16px;color:var(--muted);padding:12px 0;word-break:break-word">You checked: '+esc(r.input)+'</p>'+r.details.map(function(d){ return '<div class="kv"><span>'+esc(d[0])+'</span><span>'+esc(d[1])+'</span></div>'; }).join('')+'</div>' : '')+
      '</div>'+
    '</div>';
  }

  function vConnected(){

  /* ---------- files ---------- */
  function takeFile(file){
    S.dropError = '';
    if (!file) return;
    if (file.size > 10*1024*1024){ S.dropError = 'That file is bigger than 10 MB. Try a smaller screenshot.'; render(false); return; }
    var name = file.name || 'Screenshot';
    var isImg = /^image\//.test(file.type);
    var isText = /^text\//.test(file.type) || /\.(txt|eml)$/i.test(name);
    var isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(name);
    if (!isImg && !isText && !isPdf){ S.dropError = 'We can\u2019t read that kind of file. Use a photo, PDF, or saved email.'; render(false); return; }
    if (S.attachment && S.attachment.url) URL.revokeObjectURL(S.attachment.url);
    S.attachment = { name:name, kind:isImg?'image':(isText?'text':'pdf'), meta:(isImg?'Photo':(isText?'Text file':'PDF'))+', '+fmtSize(file.size), url:isImg?URL.createObjectURL(file):null };
    if (isText){
      var rd = new FileReader();
      rd.onload = function(){ S.input = String(rd.result).slice(0,4000); S.sampleKey = null; render(false); toast('We added the text from your file.'); };
      rd.readAsText(file);
    }
    render(false);
  }

  document.addEventListener('dragleave', function(e){ var d = e.target.closest && e.target.closest('#drop'); if (!d) return; dragDepth = Math.max(0,dragDepth-1); if (!dragDepth) d.classList.remove('is-over'); });

    prot:function(el){ S.protection = el.dataset.v; save(); render(false); var b = document.querySelector('[data-act="prot"][data-v="'+S.protection+'"]'); if (b) b.focus(); },
    toggle:function(el){ var id = el.dataset.id; S.admin[id] = !(S.admin[id]===true); save(); render(false); var b = document.querySelector('[data-act="toggle"][data-id="'+id+'"]'); if (b) b.focus(); },
    retention:function(el){ S.retention = Number(el.dataset.d); save(); render(false); var b = document.querySelector('[data-act="retention"][data-d="'+S.retention+'"]'); if (b) b.focus(); },
    deleteAll:function(){ S.history = []; S.hasAlert = false; save(); render(false); toast('History deleted.'); },
    demoToast:function(el){ toast(el.dataset.msg); },
    openLink:function(){ S.popup = true; S.sheet = null; renderOverlay(); },
    openScam:function(){ S.sheet = 'scam'; renderOverlay(); },
    openDraft:function(){ S.sheet = draftRisky() ? 'draftRisky' : 'draftSafe'; renderOverlay(); },
    send:function(){
      if (!S.draft.trim()) return;
      if (draftRisky() && S.protection==='on'){ S.sheet = 'draftRisky'; renderOverlay(); return; }
      S.draft = ''; render(false); toast('Message sent (demo).');
    },
    sheetPrimary:function(){
      var sh = S.sheet; S.sheet = null;
      if (sh === 'needPremium'){ go('plans'); }
      else if (sh === 'upgrade'){ S.plan = 'premium'; save(); render(false); toast('Premium is on. Full protection is active.'); }
      else if (sh === 'scam'){ S.scamDeleted = true; render(false); toast('Deleted and blocked.'); }
      else if (sh === 'draftRisky'){ S.draft = ''; render(false); var i = $('pe-draft'); if (i) i.focus(); }
      else renderOverlay();
    },
    seeWhy:function(){ S.result = SAMPLES.high; go('result'); },
    closeSheet:function(){ S.sheet = null; renderOverlay(); },
    closeSheetBg:function(el, k, e){ if (e.target === el){ S.sheet = null; renderOverlay(); } },
    closePopup:function(){ S.popup = false; renderOverlay(); },
    openAnyway:function(){ S.popup = false; renderOverlay(); toast('Opening the website (demo).'); },
    obNext:function(){ if (S.ob < 2){ S.ob++; renderOverlay(); } else { S.onboarded = true; save(); renderOverlay(); var h = $('view').querySelector('[data-focus]'); if (h) h.focus(); } },
    theme:function(){ var d = !isDark(); document.documentElement.setAttribute('data-theme', d?'dark':'light'); try { localStorage.setItem('phisheye-theme', d?'dark':'light'); } catch(e){} render(false); var b = document.querySelector('.theme-icon') ; if (window.matchMedia('(min-width: 881px)').matches) b = document.querySelector('#side-theme .switch'); if (b) b.focus(); },
    upgrade:function(){ S.sheet = 'upgrade'; renderOverlay(); },
    setFree:function(){ S.plan = 'free'; save(); render(false); toast('You\u2019re now on the Free plan.'); },
    obSkip:function(){ S.onboarded = true; save(); renderOverlay(); }
  };
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var fn = act[el.dataset.act];
    if (fn){ fn(el, null, e); }
  });

  window.addEventListener('hashchange', navigate);
  navigate();
})();
</script>
<script src="script.js"></script>
</body>
